<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Open Book Reader</title>
  <!-- Root-absolute, NOT relative: GitHub serves this 404 from any URL depth, so a relative
       path would resolve against the missing page's directory. The custom domain serves this
       repo at the domain ROOT, so "/" is the site root. -->
  <link rel="icon" href="/img/icon.png" />
  <!-- Like read.html: the article site learns nothing about where its visitor came from. -->
  <meta name="referrer" content="no-referrer" />
  <script>
    // A share link (/read#u=<article>, see read.html) landing here means the read page itself is
    // missing: undeployed or renamed. Rather than strand the friend, go straight on to the
    // article, as a plain link would. Only on the read page's own path and only to an http(s)
    // address: every other path stays a 404, so this site never forwards wherever a link says.
    // Exact path, no trailing slash: GitHub Pages 404s /read/ and /read.html/ even when the read
    // page exists, so allowing them would make the fallback a permanent open redirect.
    (function () {
      if (!/^\/read(\.html)?$/.test(location.pathname)) return;
      try {
        var u = new URL(new URLSearchParams(location.hash.slice(1)).get('u') || '');
        if (u.protocol === 'https:' || u.protocol === 'http:') location.replace(u.href);
      } catch (e) { /* not a share link: show the 404 */ }
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Iowan Old Style", Georgia, serif; color: #2b2722;
      background: linear-gradient(160deg, #f3ead9 0%, #faf8f3 45%, #efe6d6 100%);
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .box { max-width: 420px; }
    h1 { font-size: 64px; margin: 0; color: #8a5a2b; }
    p { font-family: system-ui, sans-serif; color: #6b6358; font-size: 16px; }
    a { color: #8a5a2b; font-family: system-ui, sans-serif; font-weight: 600; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { color: #ece4d4; background: linear-gradient(160deg, #1b1810 0%, #17150f 50%, #14110b 100%); }
      h1, a { color: #d9a566; } p { color: #9a9081; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>That page wandered off the shelf.</p>
    <p><a href="/">← Back to Open Book Reader</a></p>
  </div>
</body>
</html>
