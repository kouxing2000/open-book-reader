<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A Picture Post</title></head>
<body>
  <header><nav>Home · Galleries · About</nav></header>
  <main>
    <!-- The JNews WordPress theme's post shape: the featured picture sits outside the body, and
         the body itself carries "no-share" (or "with-share" when the floating share bar is on). -->
    <article class="post">
      <h1 class="jeg_post_title">A Picture Post</h1>
      <div class="jeg_featured featured_image"><img src="pic-700.png?lead" width="700" height="470" alt=""></div>
      <div id="post-body" class="entry-content no-share">
        <div class="jeg_share_button share-float jeg_sticky_share clearfix">
          <a href="#share-facebook">Share</a> <a href="#share-x">Post</a>
        </div>
        <div class="content-inner">
          <p>Part one of the set.</p>
          <p><img src="pic-700.png?post-0" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-1" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-2" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-3" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-4" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-5" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-6" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-7" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-8" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-9" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-10" width="700" height="470" alt=""></p>
          <p><img src="pic-700.png?post-11" width="700" height="470" alt=""></p>
        </div>
      </div>
    </article>
  </main>
  <footer>Footer text that is not part of the post.</footer>
</body>
</html>
