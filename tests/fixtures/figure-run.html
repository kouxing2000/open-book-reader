       with no prose between them at all. The shape this pins is the CAPTION — the <figure>,
       not the picture, is what owns the page, so each caption must land under its own picture
       rather than on the following page. Deliberately dozens of them, where tall-figures.html
       has one such page and consecutive-figures.html two: a rule that holds for the first few
       pictures and lapses later shows up here and nowhere else. -->
